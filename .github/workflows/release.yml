name: release

# Cut a release by pushing a semver tag (or publishing a GitHub release, which
# creates the tag): GoReleaser builds the binaries and pushes multi-arch images
# to GHCR.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release + upload archives/checksums
  packages: write # push images to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # QEMU + buildx enable the linux/arm64 image build on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
