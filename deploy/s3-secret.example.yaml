# Copy to s3-secret.yaml, fill in, and `kubectl apply -f s3-secret.yaml`.
# For AWS S3: domain=s3.amazonaws.com, protocol=https, pathStyle="false".
# For MinIO:  domain=minio.minio.svc:9000, protocol=http, pathStyle="true".
apiVersion: v1
kind: Secret
metadata:
  name: simplelog-s3
  namespace: simplelog
type: Opaque
stringData:
  bucket: "my-simplelog-bucket"
  domain: "s3.amazonaws.com"
  region: "us-east-1"
  protocol: "https"
  pathStyle: "false"
  accessKey: "AKIA..."
  secretKey: "..."
